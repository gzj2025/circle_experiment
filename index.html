<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>母亲自我与孩子关系实验</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>

  <div id="debug" style="position: fixed; top: 10px; right: 10px; background: yellow; padding: 10px; display: none;">
    调试信息
  </div>

  <!-- 阶段1：填写基本信息 -->
  <div id="page1" class="page active">
    <h2>参与者信息填写</h2>
    <form id="infoForm">
      <label>姓名：</label><input type="text" id="name" required><br>
      <label>年龄：</label><input type="number" id="age" required><br>
      <label>支付宝账号：</label><input type="text" id="alipayAccount" required><br>
      <label>支付宝昵称：</label><input type="text" id="alipayName" required><br>
      <button type="button" id="startBtn">开始实验</button>
    </form>
  </div>

  <!-- 阶段2 -->
  <div id="page2" class="page">
    <h2>阶段1：生产前与生产后的自己</h2>
    <p>请拖动两个圆圈的大小，左边代表生产前的自己，右边代表生产后的自己。</p>
    <div id="canvas1" class="canvas-container"></div>
    <button id="next1">确定</button>
    <button id="back1">返回上一步</button>
  </div>

  <!-- 阶段3 -->
  <div id="page3" class="page">
    <h2>阶段2：自己与孩子的重要性</h2>
    <p>左边圆圈代表生产后的自己，右边圆圈代表孩子。请拖动右边圆圈的大小，表示孩子的重要性。</p>
    <div id="canvas2" class="canvas-container"></div>
    <button id="next2">确定</button>
    <button id="back2">返回上一步</button>
  </div>

  <!-- 阶段4 -->
  <div id="page4" class="page">
    <h2>阶段3：您与孩子的关系距离</h2>
    <p>您可以拖动两个圆圈的距离，代表您与孩子之间的关系。</p>
    <div id="canvas3" class="canvas-container"></div>
    <p id="overlapText">重叠面积：</p>
    <button id="finish">完成实验</button>
    <button id="back3">返回上一步</button>
  </div>

  <!-- 实验结束页面 -->
  <div id="page5" class="page">
    <h2>实验结束</h2>
    <p>感谢您的参与！实验已经完成，您的数据已保存。</p>
  </div>

  <div id="loading">加载中，请稍候...</div>

  <script src="script.js"></script>
</body>
</html>
